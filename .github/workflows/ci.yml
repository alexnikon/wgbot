name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.13"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint Python files
        run: uv run ruff check .

      - name: Compile Python files
        run: uv run python -m compileall -q -x '(^|/)(\.git|\.venv|Docs)/' .

      - name: Run unit tests with coverage
        run: |
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage report

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --output-file /tmp/requirements-audit.txt
          uv run pip-audit --requirement /tmp/requirements-audit.txt --no-deps --disable-pip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: wgbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test runtime imports
        run: |
          docker run --rm --entrypoint python wgbot:ci -c \
            "import app, bot, webhook_server; print('runtime imports ok')"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: wgbot:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Validate Docker Compose configuration
        run: |
          printf 'WGBOT_IMAGE=wgbot:ci\n' > .env
          mkdir -p DB secrets
          cp cascade_servers.example.json secrets/cascade_servers.json
          docker compose config --quiet
