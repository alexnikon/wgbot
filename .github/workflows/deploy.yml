name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Run CI before production deployment
    uses: ./.github/workflows/ci.yml

  build-image:
    name: Build image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify image platforms
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
        run: |
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE")"
          for architecture in amd64 arm64; do
            jq -e --arg architecture "$architecture" \
              '.manifests | any(.platform.os == "linux" and .platform.architecture == $architecture)' \
              <<<"$manifest"
          done

  deploy:
    name: Deploy to VPS
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image to latest
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          LATEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: docker buildx imagetools create --tag "$LATEST_IMAGE" "$SOURCE_IMAGE"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/wgbot_deploy_key
          chmod 600 ~/.ssh/wgbot_deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload runtime assets
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          archive="/tmp/wgbot-runtime-${DEPLOY_SHA}.tgz"
          tar -czf "$archive" docker-compose.yml scripts/backup_runtime.py \
            scripts/persist_runtime_image.py
          scp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/wgbot_deploy_key -P "$VPS_PORT" \
            "$archive" "$VPS_USER@$VPS_HOST:.wgbot-runtime-${DEPLOY_SHA}.tgz"
          rm -f "$archive"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
          printf 'DEPLOY_PATH=%q\n' "$DEPLOY_PATH"
          printf 'IMAGE=%q\n' "$IMAGE"
          printf 'DEPLOY_SHA=%q\n' "$DEPLOY_SHA"
          printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
          printf 'GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
          cat <<'REMOTE'
          set -Eeuo pipefail

          archive="$HOME/.wgbot-runtime-${DEPLOY_SHA}.tgz"
          staging="$(mktemp -d)"
          cleanup() {
            status=$?
            trap - EXIT
            rm -rf "$staging" "$archive"
            exit "$status"
          }
          trap cleanup EXIT

          test -r "$archive"
          tar -xzf "$archive" -C "$staging"
          test -r "$staging/docker-compose.yml"
          test -r "$staging/scripts/backup_runtime.py"
          test -r "$staging/scripts/persist_runtime_image.py"

          mkdir -p "$DEPLOY_PATH/DB" "$DEPLOY_PATH/backups" \
            "$DEPLOY_PATH/scripts" "$DEPLOY_PATH/secrets"

          exec 9>"$DEPLOY_PATH/.runtime.lock"
          flock -w 600 9

          install -m 644 "$staging/docker-compose.yml" "$DEPLOY_PATH/docker-compose.yml"
          install -m 755 "$staging/scripts/backup_runtime.py" \
            "$DEPLOY_PATH/scripts/backup_runtime.py"
          install -m 755 "$staging/scripts/persist_runtime_image.py" \
            "$DEPLOY_PATH/scripts/persist_runtime_image.py"

          cd "$DEPLOY_PATH"

          python3 scripts/backup_runtime.py --root "$DEPLOY_PATH"
          test -r .env
          test -r secrets/cascade_servers.json
          test -r DB/wgbot.db
          test -w DB

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$IMAGE"

          WGBOT_IMAGE="$IMAGE" docker compose --project-name wgbot \
            up -d --no-build --remove-orphans wgbot

          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost:8001/health; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              WGBOT_IMAGE="$IMAGE" docker compose --project-name wgbot \
                logs --tail=150 wgbot
              exit 1
            fi
            sleep 5
          done
          python3 scripts/persist_runtime_image.py --env-file .env --image "$IMAGE"
          docker compose --project-name wgbot config --quiet
          docker compose --project-name wgbot ps wgbot
          docker compose --project-name wgbot logs --tail=100 wgbot
          docker image prune -f --filter "until=168h"
          REMOTE
          } | ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/wgbot_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s

      - name: Deployment summary
        run: |
          {
            echo "## Deployment completed"
            echo ""
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_SHA }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
